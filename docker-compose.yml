services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/hosts:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - unowned

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unowned
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unowned"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - unowned

  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    networks:
      - unowned

  api:
    image: airlance/go:1.26.rc
    container_name: api
    volumes:
      - ./projects/api:/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
      scylla:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - unowned

  worker:
    image: airlance/go:1.26.rc
    container_name: worker
    volumes:
      - ./projects/api:/app
    command: ["sh", "-c", "./app worker"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    networks:
      - unowned

  web:
    image: airlance/vite-react-vue:24-alpine
    container_name: web
    volumes:
      - ./projects/web:/app
    depends_on:
      - api
    environment:
      PORT: 3222
    restart: unless-stopped
    networks:
      - unowned

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: studio-minio
      MINIO_ROOT_PASSWORD: studio-minio
    volumes:
      - ./volumes/storage:/data
    networks:
      - unowned

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - unowned

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rbmq
      RABBITMQ_DEFAULT_PASS: rbmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - unowned

  scylla:
    image: scylladb/scylla:6.0
    container_name: scylla
    restart: unless-stopped
    volumes:
      - ./volumes/scylla:/var/lib/scylla
    command: --smp 1 --memory 1G --overprovisioned 1
    ports:
      - "9042:9042"
    networks:
      - unowned

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_started
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    networks:
      - unowned

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: super-secret-key-change-me
      MEILI_ENV: development
    volumes:
      - ./volumes/search:/meili_data
    networks:
      - unowned

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - 3016:8025
      - 1025:1025
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_HOSTNAME: mailpit.localhost
    networks:
      - unowned

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - unowned

  loki:
    image: grafana/loki:3.5.5
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - unowned

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=grafana-admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    networks:
      - unowned

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.18.1
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/unowned?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unowned

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis
    networks:
      - unowned

  promtail:
    image: grafana/promtail:3.5.5
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./grafana/promtail.yml:/etc/promtail/promtail.yml
      - /Users/resoul/.docker/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    networks:
      - unowned

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  unowned:
