global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: minio-job
    bearer_token: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJwcm9tZXRoZXVzIiwic3ViIjoic3R1ZGlvLW1pbmlvIiwiZXhwIjo0OTM3MjA4NTk2fQ.arjt-l7Gx4xVrIpoSBAZSSY8LAn38invgJQJ1qcGy8t72Lmy9mBI8NlY814LjQIyrpvIKMgaozglpAfmq5e5Sw
